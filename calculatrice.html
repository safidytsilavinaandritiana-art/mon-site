<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <ul>
            <a href="#addition">ADDITION</a>
            <a href="#soustraction">SOUSTRACTON</a>
            <a href="#multiplication">MULTIPLICATION</a>
            <a href="#division">DIVISION</a>
        </ul>
    </nav>
    <br>
    <br>
    <br>
    <h1 class="a">CALCULATRICE</h1>

    <div class="addition" id="addition">
        <p>ADDITION</p>
        <h5>Sommes des deux nombres</h5>
        <div class="prem">
            <button onclick="addition()">start</button>
        </div>
    </div>
    
    
    <div class="soustraction" id="soustraction">
        <p>SOUSTRACTON</p>
        <h5>Soustraction des deux nombres</h5>
        <div class="dem">
            <button onclick="soustraction()">start</button>
        </div>
    </div>

    <div class="multiplication" id="multiplication">
        <p>MULTIPLICATION</p>
        <h5>Multiplication des deux nombres</h5>
        <div class="trem">
            <button onclick="multiplication()">start</button>
        </div>

    </div>

    <div class="division"   id="division">
        <p>DIVISION</p>
          <h5>Division des deux nombre</h5>
        <div class="crem">
            <button onclick="division()">start</button>
        </div>

    </div>




    <style>
        a{
            text-decoration: none;
            font-family: Arial;
            font-size: 15px;
            border: 1px white solid;
            padding: 20px;
            border-radius: 15px;
            background-color: aqua;
        }
        ul{
            display: flex;
            justify-content: space-around;
        }


        .a{
            text-align: center;
            color: aquamarine;
            animation: miodina 2s alternate infinite;
        }
        @keyframes  miodina {
            from{
                transform: rotateX(0deg);
            }
            to{
                transform: rotateY(180deg);
            }
        }

        body{
        background: black
        }

        .addition{
                width: 350px;
     margin: 50px auto;
     padding: 20px;
     border-radius: 16px;
     box-shadow: 1px 1px 20px white;
        }

        .soustraction{
                         width: 350px;
     margin: 50px auto;
     padding: 20px;
     border-radius: 16px;
     box-shadow: 1px 1px 20px white;
        }

        .multiplication{
                         width: 350px;
     margin: 50px auto;
     padding: 20px;
     border-radius: 16px;
     box-shadow: 1px 1px 20px white;
        }
        .division{
                         width: 350px;
     margin: 50px auto;
     padding: 20px;
     border-radius: 16px;
     box-shadow: 1px 1px 20px white;
        }

        p{
            font-size: 30px;
            color: white;  
            display: flex;
            justify-content: center;      
        }

        h5{
            display: flex;
            justify-content: center;
            font-size: 20px;
            color: aliceblue;
        }

        .prem{
            display: flex;
            justify-content: center;

        }
        .dem{
            display: flex;
            justify-content: center;
        }
        .trem{
            display: flex;
            justify-content: center;
        }
        .crem{
            display: flex;
            justify-content: center;
        }
        button{
            height: 20px;
            width: 40px;
            border-radius: 15px;
            background-color: greenyellow;
            cursor: pointer;
        }

        *{
            scroll-behavior: smooth;
        }

        
    </style>



    <script>
        function addition(){
            const a = Number(prompt("Entrer la valeur de a"))
            const b = Number(prompt("Entrer la valeur de b"))
            const réponse = (a+b)
            alert("réponse ="  +  réponse)
        }

              function soustraction(){
            const a = Number(prompt("Entrer la valeur de a"))
            const b = Number(prompt("Entrer la valeur de b"))
            const réponse = (a-b)
            alert("réponse ="  +  réponse)
        }

              function multiplication(){
            const a = Number(prompt("Entrer la valeur de a"))
            const b = Number(prompt("Entrer la valeur de b"))
            const réponse = (a*b)
            alert("réponse ="  +  réponse)
        }

              function division(){
            const a = Number(prompt("Entrer la valeur de a"))
            const b = Number(prompt("Entrer la valeur de b"))
            const réponse = (a/b)
            alert("réponse ="  +  réponse)
        }
    </script>
</body>
</html>
